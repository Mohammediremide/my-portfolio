<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg4)"/>
  <g opacity="0.15" stroke="#edf1f7" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- film reel -->
  <g transform="translate(150,150)">
    <circle r="72" fill="#131a28" stroke="#2dd9c4" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="16" fill="#0d121c" stroke="#2dd9c4" stroke-width="2"/>
    <g fill="#0d121c" stroke="#2a3346" stroke-width="1.5">
      <circle cx="0" cy="-42" r="15"/>
      <circle cx="36" cy="-21" r="15"/>
      <circle cx="36" cy="21" r="15"/>
      <circle cx="0" cy="42" r="15"/>
      <circle cx="-36" cy="21" r="15"/>
      <circle cx="-36" cy="-21" r="15"/>
    </g>
  </g>

  <!-- clapperboard -->
  <g transform="translate(275,110)">
    <rect x="-10" y="20" width="90" height="64" rx="8" fill="#1a2233" stroke="#ff9d5c" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M-10 20 L80 20 L70 0 L-20 0 Z" fill="#ff9d5c"/>
    <g stroke="#0d121c" stroke-width="4">
      <line x1="-8" y1="10" x2="2" y2="0"/>
      <line x1="10" y1="10" x2="20" y2="0"/>
      <line x1="28" y1="10" x2="38" y2="0"/>
      <line x1="46" y1="10" x2="56" y2="0"/>
      <line x1="64" y1="10" x2="74" y2="0"/>
    </g>
    <rect x="4" y="38" width="60" height="6" rx="3" fill="#5a6478"/>
    <rect x="4" y="52" width="40" height="6" rx="3" fill="#5a6478"/>
  </g>
