<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgCargo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="containerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d5c"/>
      <stop offset="100%" stop-color="#e07f3e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgCargo)"/>
  <g opacity="0.15" stroke="#edf1f7" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- stacked shipping containers -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="110" height="54" rx="6" fill="#131a28" stroke="#2dd9c4" stroke-opacity="0.4" stroke-width="1.5"/>
    <g stroke="#2a3346" stroke-width="1.5">
      <line x1="18" y1="0" x2="18" y2="54"/>
      <line x1="36" y1="0" x2="36" y2="54"/>
      <line x1="54" y1="0" x2="54" y2="54"/>
      <line x1="72" y1="0" x2="72" y2="54"/>
      <line x1="90" y1="0" x2="90" y2="54"/>
    </g>
    <rect x="0" y="-58" width="80" height="50" rx="6" fill="url(#containerGrad)"/>
    <g stroke="#c96a2f" stroke-width="1.5">
      <line x1="14" y1="-58" x2="14" y2="-8"/>
      <line x1="28" y1="-58" x2="28" y2="-8"/>
      <line x1="42" y1="-58" x2="42" y2="-8"/>
      <line x1="56" y1="-58" x2="56" y2="-8"/>
      <line x1="70" y1="-58" x2="70" y2="-8"/>
    </g>
  </g>

  <!-- crane hook -->
  <g transform="translate(260,60)" stroke="#5a6478" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="60"/>
    <path d="M-10 60 a10 10 0 0 0 20 0"/>
  </g>
  <line x1="60" y1="20" x2="300" y2="20" stroke="#2a3346" stroke-width="4"/>
  <line x1="60" y1="20" x2="60" y2="120" stroke="#2a3346" stroke-width="4"/>

  <!-- route/globe accent -->
  <g transform="translate(300,190)" stroke="#2dd9c4" stroke-width="2" fill="none" opacity="0.6">
    <circle r="26"/>
    <ellipse rx="26" ry="10"/>
    <ellipse rx="10" ry="26"/>
  </g>
</svg>
