<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <g opacity="0.15" stroke="#edf1f7" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- kanban columns -->
  <g transform="translate(60,54)">
    <!-- column 1 -->
    <rect x="0" y="0" width="92" height="190" rx="12" fill="#131a28" stroke="#2a3346" stroke-width="1"/>
    <rect x="12" y="16" width="40" height="8" rx="4" fill="#5a6478"/>
    <rect x="10" y="36" width="72" height="30" rx="8" fill="#1a2233" stroke="#2dd9c4" stroke-opacity="0.5"/>
    <rect x="10" y="74" width="72" height="30" rx="8" fill="#1a2233" stroke="#2a3346"/>
    <rect x="10" y="112" width="72" height="30" rx="8" fill="#1a2233" stroke="#2a3346"/>

    <!-- column 2 (active) -->
    <rect x="106" y="-10" width="92" height="220" rx="12" fill="#131a28" stroke="#ff9d5c" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="118" y="10" width="40" height="8" rx="4" fill="#ff9d5c"/>
    <rect x="116" y="30" width="72" height="34" rx="8" fill="#1a2233" stroke="#ff9d5c" stroke-opacity="0.6"/>
    <rect x="126" y="42" width="30" height="6" rx="3" fill="#5a6478"/>
    <rect x="126" y="52" width="46" height="6" rx="3" fill="#5a6478"/>
    <rect x="116" y="72" width="72" height="34" rx="8" fill="#1a2233" stroke="#2a3346"/>
    <rect x="116" y="114" width="72" height="34" rx="8" fill="#1a2233" stroke="#2a3346"/>

    <!-- column 3 -->
    <rect x="212" y="6" width="92" height="174" rx="12" fill="#131a28" stroke="#2a3346" stroke-width="1"/>
    <rect x="224" y="22" width="40" height="8" rx="4" fill="#2dd9c4"/>
    <rect x="222" y="42" width="72" height="30" rx="8" fill="#1a2233" stroke="#2dd9c4" stroke-opacity="0.4"/>
    <circle cx="290" cy="57" r="4" fill="#2dd9c4"/>
  </g>

  <!-- magnifier / search accent -->
  <g transform="translate(230,60)" stroke="#2dd9c4" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="14" fill="#0d121c" fill-opacity="0.6"/>
    <line x1="10" y1="10" x2="20" y2="20"/>
  </g>
