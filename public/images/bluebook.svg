<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2233"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd9c4"/>
      <stop offset="100%" stop-color="#1ba896"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <g opacity="0.15" stroke="#edf1f7" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- flashcards stack -->
  <g transform="translate(240,90)">
    <rect x="-4" y="16" width="120" height="76" rx="10" fill="#1a2233" stroke="#2a3346" transform="rotate(6)"/>
    <rect x="-4" y="8" width="120" height="76" rx="10" fill="#131a28" stroke="#2a3346" transform="rotate(-3)"/>
    <rect x="0" y="0" width="120" height="76" rx="10" fill="#0d121c" stroke="#ff9d5c" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="16" y="18" width="60" height="8" rx="4" fill="#ff9d5c"/>
    <rect x="16" y="34" width="88" height="6" rx="3" fill="#5a6478"/>
    <rect x="16" y="48" width="70" height="6" rx="3" fill="#5a6478"/>
  </g>

  <!-- open book -->
  <g transform="translate(90,150)">
    <path d="M0 -50 C24 -60 48 -60 62 -50 L62 60 C48 50 24 50 0 60 Z" fill="url(#bookGrad)"/>
    <path d="M124 -50 C100 -60 76 -60 62 -50 L62 60 C76 50 100 50 124 60 Z" fill="#22c9b3"/>
    <g stroke="#0d121c" stroke-width="2" opacity="0.35">
      <line x1="10" y1="-30" x2="52" y2="-38"/>
      <line x1="10" y1="-14" x2="52" y2="-22"/>
      <line x1="10" y1="2" x2="52" y2="-6"/>
      <line x1="72" y1="-38" x2="114" y2="-30"/>
      <line x1="72" y1="-22" x2="114" y2="-14"/>
      <line x1="72" y1="-6" x2="114" y2="2"/>
    </g>
    <line x1="62" y1="-50" x2="62" y2="60" stroke="#0a1a17" stroke-width="2"/>
  </g>
</svg>
